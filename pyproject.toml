[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchman"
version = "0.2.0"
description = "A reliability layer for long-running AI agents that operate on a folder of files."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
watchman = "watchman.cli:main"

[tool.setuptools.packages.find]
include = ["watchman", "watchman.checks"]
